<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wink: one open eye, one closed, playful -->
  <ellipse cx="37" cy="54" rx="8" ry="9" fill="white"/>
  <circle cx="38" cy="55" r="5" fill="#0F172A"/>
  <circle cx="40" cy="52" r="2" fill="white"/>
  <circle cx="36" cy="56" r="0.8" fill="white"/>
  <!-- Wink eye (closed) -->
  <path d="M56 55Q63 49 70 55" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Blush under wink -->
  <ellipse cx="70" cy="60" rx="4" ry="2.5" fill="#FF9999" opacity="0.35"/>
  <!-- Cheeky smile -->
  <path d="M43 66Q50 72 57 66" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
</svg>
