<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sword — held straight up at the right side of the body -->
  <!-- Blade (straight, right of body) -->
  <rect x="76" y="22" width="4" height="32" rx="1" fill="#C0C0C0"/>
  <rect x="77" y="22" width="1.5" height="18" rx="0.5" fill="#E5E7EB" opacity="0.5"/>
  <!-- Blade tip -->
  <path d="M76 22L78 14L80 22z" fill="#D1D5DB"/>
  <!-- Crossguard -->
  <rect x="71" y="53" width="14" height="3" rx="1.5" fill="#D4AF37"/>
  <!-- Grip -->
  <rect x="76" y="56" width="4" height="10" rx="1" fill="#78350F"/>
  <line x1="76.5" y1="58.5" x2="79.5" y2="58.5" stroke="#92400E" stroke-width="0.8" opacity="0.5"/>
  <line x1="76.5" y1="61" x2="79.5" y2="61" stroke="#92400E" stroke-width="0.8" opacity="0.5"/>
  <!-- Pommel -->
  <circle cx="78" cy="68" r="2.5" fill="#D4AF37"/>
  <circle cx="78" cy="68" r="1.2" fill="#EAB308"/>
  <!-- Hand nub gripping the sword -->
  <ellipse cx="73" cy="62" rx="4.5" ry="4" fill="#475569" opacity="0.45"/>
</svg>
