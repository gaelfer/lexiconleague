  <path d="M62 78Q64 86 60 96" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2.5 3.5" opacity="0.4"/>
  <!-- Fringe at end -->
  <line x1="58" y1="94" x2="57" y2="98" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="95" x2="59.5" y2="99" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="94.5" x2="62" y2="98.5" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
</svg>
